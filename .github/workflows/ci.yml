name: Fixture CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Fixtures (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TMPDIR: ${{ runner.temp }}
      HERMES_HOME: ${{ runner.temp }}/hea-fixture-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify committed distribution
        run: |
          python scripts/build_plugins.py
          git diff --exit-code -- plugins/
          git diff --check
      - name: Run standard-library fixtures (no Hermes or vendor calls)
        run: |
          python -m unittest discover -s tests -p test_client.py -v
          python -m unittest discover -s tests -p test_runner.py -v
          python -m unittest discover -s tests -p test_packaging.py -v
          python -m unittest discover -s tests -p test_stabilization_probe.py -v
