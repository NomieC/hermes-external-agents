name: Feature or adapter proposal
description: Propose a focused improvement or runtime adapter.
title: "[Proposal]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: User workflow and gap
      description: What should become possible, and what currently happens?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Public interfaces and verification
      description: Describe permission boundaries, expected failure behavior and how success can be independently tested. Do not include credentials or private task content.
    validations:
      required: true
